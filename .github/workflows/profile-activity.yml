name: Refresh profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths:
      - design/generate_profile.py
      - design/update_activity.py
      - .github/workflows/profile-activity.yml

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install vector typography dependency
        run: python -m pip install --disable-pip-version-check fonttools==4.65.0
      - name: Read public GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python design/update_activity.py
      - name: Render and validate profile artwork
        run: |
          python design/generate_profile.py
          python design/check_profile.py
      - name: Commit updated public statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile design/activity.json design/text-layout.json
          if git diff --cached --quiet; then
            echo "The public statistics are already current."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Refresh public profile activity"
          git push origin HEAD:main
